name: iOS app (simulator build)

# Compile check for the Capacitor iOS app on a macOS runner: builds for the iOS Simulator, so it needs no Apple
# developer account or signing. App Store builds are archived and uploaded from Xcode (docs/NATIVE-APPS.md).
# Manual only: macOS minutes cost 10x Linux minutes on private repositories.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Copy web build into the iOS project
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Zip simulator app
        run: cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/App-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: App-simulator.zip
