name: Deploy

# The live site is built from main. The dev branch is built into <site>/dev/ as a preview: every push to dev runs
# the Check workflow, and when that passes this workflow redeploys both.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
      # Dev preview: the dev branch with every game folder playable at #/dev. Never blocks the live site.
      - name: Build dev preview
        continue-on-error: true
        # Realtime only (online private tables across devices); the dev back office stays in local demo mode.
        env:
          VITE_REALTIME_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_REALTIME_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          git fetch --depth=1 origin dev || { echo "No dev branch: skipping."; exit 0; }
          git worktree add ../devsrc FETCH_HEAD
          cd ../devsrc
          # Reuse main's packages unless dev changed them.
          if cmp -s package-lock.json "$GITHUB_WORKSPACE/package-lock.json"; then ln -s "$GITHUB_WORKSPACE/node_modules" node_modules; else npm ci; fi
          VITE_DEV_PREVIEW=1 VITE_RELEASE="dev-$(git rev-parse --short HEAD)" npx vite build --outDir "$GITHUB_WORKSPACE/dist/dev" --emptyOutDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Cloudflare Pages (main hosting once set up): needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'webgames' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set: skipping (GitHub Pages deploy still runs)."; exit 0
          fi
          npx --yes wrangler@4.147.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.147.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
